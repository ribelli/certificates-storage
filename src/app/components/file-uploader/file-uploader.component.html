<div class="c-upload"
     appDragAndDrop
     (click)="fileInput.click()"
     (fileDropped)="onFilesDropped($event)">
    <input type="file" hidden
           #fileInput
           accept=".cer,.crt,.der,.pem"
           (change)="onFileSelected(fileInput)">
    <div class="c-upload__text">
        {{ uploadText }}
    </div>
</div>
